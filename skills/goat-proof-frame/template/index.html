<!doctype html>
<html lang="mn" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
    <script src="plan.js"></script>
    <script src="goat-lib.js"></script>
    <link rel="stylesheet" href="look.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div id="hz"></div>
      <div id="stage">
        <div class="ph" id="bf">
          <div class="scr"><video id="before" src="media/before.mp4" data-start="0" data-duration="{{DUR}}" data-media-start="0" data-track-index="1" muted playsinline></video><span class="tag"></span></div>
        </div>
        <div class="ph" id="af">
          <div class="scr"><video id="after" src="main.mp4" data-start="0" data-duration="{{DUR}}" data-media-start="0" data-track-index="0" muted playsinline></video><span class="tag"></span></div>
        </div>
        <svg id="arc" viewBox="0 0 1080 1920" aria-hidden="true">
          <defs><mask id="draw" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920"><path id="pen" /></mask></defs>
          <g mask="url(#draw)"><path id="dots" /></g>
          <path id="head" />
        </svg>
      </div>
      <div id="cm" class="c"><i></i><span><small></small><b></b></span></div>
      <div id="hl" class="c"></div>
      <div id="sp" class="c"><span class="dot"></span><span class="t"></span><span class="go">↑</span></div>
      <div id="pp"><span class="dot"></span><span class="t"></span></div>
    </div>
    <script src="look.js"></script>
  </body>
</html>
